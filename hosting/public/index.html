<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>台股 Pro 管理後台</title>
<style>
  :root { color-scheme: dark; }
  body { font-family: system-ui, "Noto Sans TC", sans-serif; background:#0b0e13; color:#f2f5f9;
         margin:0; padding:24px; max-width:560px; margin-inline:auto; }
  h1 { font-size:20px; } h2 { font-size:14px; color:#9aa6b6; margin-top:28px; }
  label { display:block; font-size:12px; color:#9aa6b6; margin:10px 0 4px; }
  input[type=text], textarea { width:100%; box-sizing:border-box; background:#141922;
    border:1px solid #2a3441; border-radius:8px; padding:10px; color:#f2f5f9; font-size:14px; }
  textarea { min-height:80px; }
  button { background:#3b82f6; color:#fff; border:0; border-radius:8px; padding:10px 16px;
    font-size:14px; cursor:pointer; margin-top:14px; }
  button.ghost { background:#1c2430; }
  .row { display:flex; gap:10px; align-items:center; }
  .card { background:#141922; border:1px solid #2a3441; border-radius:12px; padding:16px; margin-top:14px; }
  .muted { color:#63718a; font-size:12px; }
  #msg { color:#16c784; font-size:13px; min-height:18px; margin-top:8px; }
</style>
</head>
<body>
<h1>台股 Pro · 管理後台</h1>

<div id="auth">
  <button id="loginBtn">用 Google 登入</button>
  <p class="muted">請用 firestore.rules / functions 裡設定的擁有者 Google 帳號登入。</p>
</div>

<div id="panel" style="display:none">
  <div class="row" style="justify-content:space-between">
    <span class="muted" id="who"></span>
    <button class="ghost" id="logoutBtn">登出</button>
  </div>

  <h2>開啟頁公告 / 廣告</h2>
  <div class="card">
    <div class="row"><input type="checkbox" id="a_enabled" /> <label style="margin:0">啟用（開啟 App 時顯示）</label></div>
    <div class="row"><input type="checkbox" id="a_blocking" /> <label style="margin:0">維護模式（強制擋畫面、不可關閉）</label></div>
    <label>標題</label><input type="text" id="a_title" />
    <label>內容</label><textarea id="a_body"></textarea>
    <label>連結網址（可留空）</label><input type="text" id="a_link" />
    <label>連結按鈕文字</label><input type="text" id="a_linktext" value="查看" />
    <button id="saveAnnounce">儲存公告</button>
    <span class="muted" id="a_ver"></span>
  </div>

  <h2>推播廣播</h2>
  <div class="card">
    <label>標題</label><input type="text" id="b_title" />
    <label>內容</label><textarea id="b_body"></textarea>
    <button id="sendBroadcast">送給所有裝置</button>
    <div class="muted" id="devCount"></div>
  </div>

  <div id="msg"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, addDoc, getCountFromServer, collection, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBiWCp7o3bqO3nhCdBVrEW-GnYaldKoBNk",
  authDomain: "stock-app-89b5a.firebaseapp.com",
  projectId: "stock-app-89b5a",
  appId: "1:84576014966:web:c4ac6bcd98eeaafeeac557",
  messagingSenderId: "84576014966",
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const $ = (id) => document.getElementById(id);
const msg = (t, ok = true) => { $("msg").textContent = t; $("msg").style.color = ok ? "#16c784" : "#ff4d4f"; };

$("loginBtn").onclick = () => signInWithPopup(auth, new GoogleAuthProvider()).catch(e => msg(e.message, false));
$("logoutBtn").onclick = () => signOut(auth);

onAuthStateChanged(auth, async (u) => {
  $("auth").style.display = u ? "none" : "block";
  $("panel").style.display = u ? "block" : "none";
  if (!u) return;
  $("who").textContent = u.email;
  // 載入公告
  const s = await getDoc(doc(db, "config/announcement"));
  const d = s.data() || {};
  $("a_enabled").checked = !!d.enabled;
  $("a_blocking").checked = !!d.blocking;
  $("a_title").value = d.title || "";
  $("a_body").value = d.body || "";
  $("a_link").value = d.linkUrl || "";
  $("a_linktext").value = d.linkText || "查看";
  $("a_ver").textContent = "目前版本 v" + (d.version || 1);
  // 裝置數
  try {
    const c = await getCountFromServer(collection(db, "devices"));
    $("devCount").textContent = "目前裝置數：" + c.data().count;
  } catch {}
});

$("saveAnnounce").onclick = async () => {
  const cur = (await getDoc(doc(db, "config/announcement"))).data() || {};
  const version = (cur.version || 1) + 1; // 每次存檔 +1，App 才會再跳一次
  try {
    await setDoc(doc(db, "config/announcement"), {
      enabled: $("a_enabled").checked,
      blocking: $("a_blocking").checked,
      title: $("a_title").value,
      body: $("a_body").value,
      linkUrl: $("a_link").value,
      linkText: $("a_linktext").value || "查看",
      version,
    });
    $("a_ver").textContent = "已儲存，版本 v" + version;
    msg("公告已更新");
  } catch (e) { msg(e.message, false); }
};

$("sendBroadcast").onclick = async () => {
  if (!$("b_title").value) return msg("缺少標題", false);
  try {
    await addDoc(collection(db, "broadcasts"), {
      title: $("b_title").value,
      body: $("b_body").value,
      sent: false,
      createdAt: serverTimestamp(),
    });
    $("b_title").value = ""; $("b_body").value = "";
    msg("已排入佇列，下次排程（約 15 分內）會送出");
  } catch (e) { msg(e.message, false); }
};
</script>
</body>
</html>
