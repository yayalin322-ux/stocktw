<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>台股 Pro 管理後台</title>
<style>
  :root {
    --bg:#0b0e13; --surface:#141922; --surface2:#1c2430; --border:#2a3441;
    --ink:#f2f5f9; --ink2:#9aa6b6; --ink3:#63718a;
    --accent:#3b82f6; --up:#ff4d4f; --down:#16c784; --warn:#f5a623;
    color-scheme: dark;
  }
  [data-theme="light"] {
    --bg:#f5f6f8; --surface:#ffffff; --surface2:#eef0f3; --border:#e1e4e9;
    --ink:#12151a; --ink2:#5b6572; --ink3:#8a93a0;
    color-scheme: light;
  }
  * { box-sizing:border-box; }
  body { font-family: system-ui, "Noto Sans TC", sans-serif; background:var(--bg); color:var(--ink);
         margin:0; padding:24px; max-width:640px; margin-inline:auto; transition:background .15s,color .15s; }
  h1 { font-size:20px; margin:0; } h2 { font-size:14px; color:var(--ink3); margin-top:28px; }
  label { display:block; font-size:12px; color:var(--ink3); margin:10px 0 4px; }
  input[type=text], textarea { width:100%; background:var(--surface2);
    border:1px solid var(--border); border-radius:8px; padding:10px; color:var(--ink); font-size:14px; }
  textarea { min-height:80px; font-family:inherit; }
  button { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:10px 16px;
    font-size:14px; cursor:pointer; margin-top:14px; }
  button.ghost { background:var(--surface2); color:var(--ink); }
  button.icon { padding:8px 10px; margin-top:0; }
  .row { display:flex; gap:10px; align-items:center; }
  .card { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:16px; margin-top:14px; }
  .muted { color:var(--ink3); font-size:12px; }
  #msg { color:var(--down); font-size:13px; min-height:18px; margin-top:8px; }
  .stat-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:6px; }
  .stat { background:var(--surface2); border-radius:8px; padding:10px; text-align:center; }
  .stat b { display:block; font-size:20px; }
  table { width:100%; border-collapse:collapse; font-size:13px; margin-top:6px; }
  th, td { text-align:left; padding:6px 4px; border-bottom:1px solid var(--border); }
  th { color:var(--ink3); font-weight:500; font-size:11px; }
  .badge { display:inline-block; padding:1px 7px; border-radius:9px; font-size:11px; }
  .badge.ok { background:rgba(22,199,132,.18); color:var(--down); }
  .badge.pending { background:rgba(245,166,35,.18); color:var(--warn); }
  .empty { color:var(--ink3); font-size:12px; padding:10px 0; }
</style>
</head>
<body>
<div class="row" style="justify-content:space-between">
  <h1>台股 Pro · 管理後台</h1>
  <button class="ghost icon" id="themeBtn" title="切換淺色/深色">🌓</button>
</div>

<div id="auth">
  <button id="loginBtn">用 Google 登入</button>
  <p class="muted">請用 firestore.rules 裡設定的擁有者 Google 帳號登入。</p>
</div>

<div id="panel" style="display:none">
  <div class="row" style="justify-content:space-between; margin-top:10px">
    <span class="muted" id="who"></span>
    <button class="ghost" id="logoutBtn">登出</button>
  </div>

  <h2>總覽</h2>
  <div class="card">
    <div class="stat-grid">
      <div class="stat"><b id="s_devices">--</b><span class="muted">裝置數</span></div>
      <div class="stat"><b id="s_activeAlerts">--</b><span class="muted">待觸發提醒</span></div>
      <div class="stat"><b id="s_triggeredAlerts">--</b><span class="muted">已觸發提醒</span></div>
    </div>
  </div>

  <h2>裝置清單</h2>
  <div class="card">
    <table>
      <thead><tr><th>平台</th><th>更新時間</th><th>提醒數</th></tr></thead>
      <tbody id="deviceRows"></tbody>
    </table>
    <div class="empty" id="deviceEmpty" style="display:none">還沒有裝置註冊</div>
  </div>

  <h2>開啟頁公告 / 廣告</h2>
  <div class="card">
    <div class="row"><input type="checkbox" id="a_enabled" style="width:auto" /> <label style="margin:0">啟用（開啟 App 時顯示）</label></div>
    <div class="row"><input type="checkbox" id="a_blocking" style="width:auto" /> <label style="margin:0">維護模式（強制擋畫面、不可關閉）</label></div>
    <label>標題</label><input type="text" id="a_title" />
    <label>內容</label><textarea id="a_body"></textarea>
    <label>連結網址（可留空）</label><input type="text" id="a_link" />
    <label>連結按鈕文字</label><input type="text" id="a_linktext" value="查看" />
    <button id="saveAnnounce">儲存公告</button>
    <span class="muted" id="a_ver"></span>
  </div>

  <h2>推播廣播</h2>
  <div class="card">
    <label>標題</label><input type="text" id="b_title" />
    <label>內容</label><textarea id="b_body"></textarea>
    <button id="sendBroadcast">送給所有裝置</button>
    <div class="muted">會排進佇列，等排程（GitHub Actions）撿到才真的送出，
      免費排程不保證準時，有時會延遲。</div>
  </div>

  <h2>推播紀錄</h2>
  <div class="card">
    <table>
      <thead><tr><th>標題</th><th>時間</th><th>狀態</th></tr></thead>
      <tbody id="broadcastRows"></tbody>
    </table>
    <div class="empty" id="broadcastEmpty" style="display:none">還沒有推播紀錄</div>
  </div>

  <div id="msg"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, addDoc, getDocs, collection, query, orderBy, limit, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBiWCp7o3bqO3nhCdBVrEW-GnYaldKoBNk",
  authDomain: "stock-app-89b5a.firebaseapp.com",
  projectId: "stock-app-89b5a",
  appId: "1:84576014966:web:c4ac6bcd98eeaafeeac557",
  messagingSenderId: "84576014966",
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const $ = (id) => document.getElementById(id);
const msg = (t, ok = true) => { $("msg").textContent = t; $("msg").style.color = ok ? "var(--down)" : "var(--up)"; };

// ---- 淺色/深色 ----
const root = document.documentElement;
function applyTheme(t) { root.setAttribute("data-theme", t); localStorage.setItem("theme", t); }
applyTheme(localStorage.getItem("theme") || "dark");
$("themeBtn").onclick = () => applyTheme(root.getAttribute("data-theme") === "light" ? "dark" : "light");

$("loginBtn").onclick = () => signInWithPopup(auth, new GoogleAuthProvider()).catch(e => msg(e.message, false));
$("logoutBtn").onclick = () => signOut(auth);

function fmtTime(ts) {
  if (!ts) return "--";
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  return d.toLocaleString("zh-TW", { month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" });
}

async function loadOverview() {
  try {
    const [devicesSnap, alertsSnap] = await Promise.all([
      getDocs(collection(db, "devices")),
      getDocs(collection(db, "deviceAlerts")),
    ]);

    $("s_devices").textContent = devicesSnap.size;

    let active = 0, triggered = 0;
    const alertCountByToken = {};
    alertsSnap.forEach((d) => {
      const list = d.data().alerts || [];
      alertCountByToken[d.id] = list.length;
      for (const a of list) (a.triggered ? triggered++ : active++);
    });
    $("s_activeAlerts").textContent = active;
    $("s_triggeredAlerts").textContent = triggered;

    // 裝置清單
    const rows = [];
    devicesSnap.forEach((d) => {
      const v = d.data();
      rows.push({ platform: v.platform || "?", updatedAt: v.updatedAt, alerts: alertCountByToken[d.id] || 0 });
    });
    rows.sort((a, b) => (b.updatedAt?.seconds || 0) - (a.updatedAt?.seconds || 0));
    $("deviceRows").innerHTML = rows.map(r =>
      `<tr><td>${r.platform}</td><td>${fmtTime(r.updatedAt)}</td><td>${r.alerts}</td></tr>`
    ).join("");
    $("deviceEmpty").style.display = rows.length ? "none" : "block";
  } catch (e) { msg(e.message, false); }
}

async function loadBroadcasts() {
  try {
    const q = query(collection(db, "broadcasts"), orderBy("createdAt", "desc"), limit(10));
    const snap = await getDocs(q);
    const rows = [];
    snap.forEach((d) => {
      const v = d.data();
      rows.push(`<tr><td>${v.title || ""}</td><td>${fmtTime(v.createdAt)}</td>` +
        `<td><span class="badge ${v.sent ? "ok" : "pending"}">${v.sent ? "已送出" : "排隊中"}</span></td></tr>`);
    });
    $("broadcastRows").innerHTML = rows.join("");
    $("broadcastEmpty").style.display = rows.length ? "none" : "block";
  } catch (e) { msg(e.message, false); }
}

onAuthStateChanged(auth, async (u) => {
  $("auth").style.display = u ? "none" : "block";
  $("panel").style.display = u ? "block" : "none";
  if (!u) return;
  $("who").textContent = u.email;
  // 載入公告
  const s = await getDoc(doc(db, "config/announcement"));
  const d = s.data() || {};
  $("a_enabled").checked = !!d.enabled;
  $("a_blocking").checked = !!d.blocking;
  $("a_title").value = d.title || "";
  $("a_body").value = d.body || "";
  $("a_link").value = d.linkUrl || "";
  $("a_linktext").value = d.linkText || "查看";
  $("a_ver").textContent = "目前版本 v" + (d.version || 1);

  loadOverview();
  loadBroadcasts();
});

$("saveAnnounce").onclick = async () => {
  const cur = (await getDoc(doc(db, "config/announcement"))).data() || {};
  const version = (cur.version || 1) + 1; // 每次存檔 +1，App 才會再跳一次
  try {
    await setDoc(doc(db, "config/announcement"), {
      enabled: $("a_enabled").checked,
      blocking: $("a_blocking").checked,
      title: $("a_title").value,
      body: $("a_body").value,
      linkUrl: $("a_link").value,
      linkText: $("a_linktext").value || "查看",
      version,
    });
    $("a_ver").textContent = "已儲存，版本 v" + version;
    msg("公告已更新");
  } catch (e) { msg(e.message, false); }
};

$("sendBroadcast").onclick = async () => {
  if (!$("b_title").value) return msg("缺少標題", false);
  try {
    await addDoc(collection(db, "broadcasts"), {
      title: $("b_title").value,
      body: $("b_body").value,
      sent: false,
      createdAt: serverTimestamp(),
    });
    $("b_title").value = ""; $("b_body").value = "";
    msg("已排入佇列，等排程撿到會送出");
    loadBroadcasts();
  } catch (e) { msg(e.message, false); }
};
</script>
</body>
</html>
